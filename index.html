<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformers.js Text Generation</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.10.0"
      }
    }
    </script>
</head>
<body>
    <div class="container">
        <h1>AI Text Generator</h1>
        <p>Enter a prompt and see what the AI generates!</p>
        
        <div id="status">Loading model... This may take a moment.</div>
        
        <div class="input-area">
            <textarea id="prompt-input" placeholder="Loading..." disabled rows="3"></textarea>
            <button id="generate-btn" disabled>Generate</button>
        </div>
        
        <h2>Output:</h2>
        <pre id="output-box">...</pre>
    </div>

    <script type="module" src="main.js"></script>
