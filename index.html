<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
      "imports": {
        "@xenova/transformers": "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.10.0"
      }
    }
    </script>
</head>
<body>
    <div class="chat-wrapper">
        <h1>AI Chatbot</h1>
        
        <div class="model-selector">
            <label for="model-select">Choose Model:</label>
            <select id="model-select">
                <option value="Xenova/distilgpt2">DistilGPT2 (Fast, ~80MB)</option>
                <option value="Xenova/gpt2">GPT2 (Better quality, ~240MB)</option>
                <option value="Xenova/distilgpt2">DistilGPT2 Alternative (Fast, ~80MB)</option>
            </select>
            <button id="load-model-btn">Load Model</button>
        </div>

        <div id="chat-history">
            <!-- Messages will be appended here -->
        </div>

        <form id="chat-form">
            <textarea id="message-input" placeholder="Loading..." disabled rows="1"></textarea>
            <button id="send-btn" type="submit" disabled>Send</button>
        </form>
    </div>

    <script type="module" src="main.js"></script>

</body>
</html>
